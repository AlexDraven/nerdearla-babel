services:
  ollama:
    image: ollama/ollama:latest
    container_name: babel-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: 1
    # Sin reserva de GPU acá a propósito: así `docker compose up` funciona
    # out-of-the-box en cualquier máquina (corre en CPU, más lento). Para
    # acelerar con GPU NVIDIA, sumar el override:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Descarga el modelo la primera vez que se levanta el stack. Corre una
  # sola vez (restart: "no") y termina; no bloquea el healthcheck de ollama.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-gemma4:e2b}"]
    restart: "no"

  backend:
    build: .
    container_name: babel-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"        # HTTP + WS viewers/control
      - "1935:1935"        # RTMP ingest sala 1 (solo se usa si BABEL_INGEST_PROTOCOL=rtmp)
      - "1936:1936"        # RTMP ingest sala 2
      - "9998:9998/udp"    # SRT ingest alternativo
    environment:
      # Todas via ${VAR:-default}: así lo que se edite en .env realmente pega
      # cuando se corre `docker compose up` (antes varias quedaban
      # hardcodeadas acá y .env no tenía ningún efecto sobre ellas).
      BABEL_ROOM_IDS: ${BABEL_ROOM_IDS:-main,room2,mic}  # 2 salas de demo + 1 de micrófono en vivo — ver docs/SCALING.md
      BABEL_MIC_ROOM_IDS: ${BABEL_MIC_ROOM_IDS:-mic}     # ids que fuerzan modo micrófono (frontend/mic/), sin importar BABEL_INGEST_PROTOCOL
      BABEL_OLLAMA_BASE_URL: ${BABEL_OLLAMA_BASE_URL:-http://ollama:11434/v1}
      BABEL_OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      BABEL_TARGET_LANG: ${BABEL_TARGET_LANG:-es}
      # Modo "file": cada sala ingiere en loop tests/fixtures/<room_id>.wav (o el
      # fixture de ejemplo si ese archivo no existe) — demo sin pasos manuales.
      # Para usar un stream real de OBS/consola, cambiar a BABEL_INGEST_PROTOCOL=rtmp.
      BABEL_INGEST_PROTOCOL: ${BABEL_INGEST_PROTOCOL:-file}
      BABEL_INGEST_HOST: ${BABEL_INGEST_HOST:-0.0.0.0}
      BABEL_INGEST_BASE_PORT: ${BABEL_INGEST_BASE_PORT:-1935}
      BABEL_CHUNK_SECONDS: ${BABEL_CHUNK_SECONDS:-4}
      BABEL_MAX_QUEUE_SIZE: ${BABEL_MAX_QUEUE_SIZE:-2}
      BABEL_GLOSSARY_PATH: ${BABEL_GLOSSARY_PATH:-/app/glossaries/example-charla-kubernetes.yaml}
      BABEL_LOG_LEVEL: ${BABEL_LOG_LEVEL:-INFO}
    volumes:
      - ./glossaries:/app/glossaries:ro
      - ./tests/fixtures:/app/tests/fixtures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ollama_models:
